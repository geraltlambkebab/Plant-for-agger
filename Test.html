<!doctype html>
<html lang="zh-HK">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>植物澆水紀錄</title>
  <link rel="manifest" href="./manifest.json" />
  <style>
    :root{--primary:#0a84ff;--muted:#666;--card:#fff;--border:#e6e6e6}
    body{font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial; margin:12px; max-width:720px;color:#111;background:#fafafa}
    header{display:flex;align-items:center;gap:12px;margin-bottom:8px}
    h1{font-size:1.25rem;margin:0}
    .card{background:var(--card);border:1px solid var(--border);padding:12px;border-radius:10px;margin-bottom:12px}
    label{display:block;margin-top:8px;font-weight:600}
    input,button,textarea,select{width:100%;padding:8px;margin-top:6px;border-radius:8px;border:1px solid #ccc;font-size:1rem}
    .row{display:flex;gap:8px}
    .row > *{flex:1}
    .thumb{max-width:100%;border-radius:8px;margin-top:8px;display:block}
    .small{font-size:0.9rem;color:var(--muted)}
    .chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
    .chip{padding:6px 12px;border-radius:20px;background:#f1f1f1;border:1px solid #e0e0e0;cursor:pointer;user-select:none}
    .chip.active{background:var(--primary);color:#fff;border-color:var(--primary)}
    .hint{font-size:0.85rem;color:var(--muted);margin-top:6px}
    .btn-primary{background:var(--primary);color:#fff;border:none}
    .btn-muted{background:#f8f8f8;border:1px solid #ddd}
    .status-ok{color:green}
    .status-warn{color:orange}
    .status-err{color:red}
    .plant{border:1px solid #eee;padding:10px;margin:10px 0;border-radius:8px;background:#fff}
    @media (min-width:640px){ input,button,textarea,select{font-size:1.05rem} }
  </style>
</head>
<body>
  <header>
    <h1>植物澆水紀錄</h1>
  </header>

  <main class="card" id="mainCard">
    <label>選擇或輸入植物名稱</label>
    <input id="plantInput" type="text" placeholder="輸入植物名稱或點選下方建議" autocomplete="off" />
    <div class="chips" id="suggestions" aria-hidden="false"></div>
    <div class="hint">點選建議或輸入自訂名稱；儲存後會加入建議清單。</div>

    <label>目標重量 (g)</label>
    <input id="targetWeight" type="number" min="0" inputmode="numeric" />

    <label>目前重量 (g)</label>
    <input id="currentWeight" type="number" min="0" inputmode="numeric" />

    <div class="row" style="margin-top:8px">
      <button id="compareBtn" class="btn-muted">比較重量</button>
      <button id="takePhotoBtn" class="btn-muted">拍照 / 選照片</button>
    </div>

    <input id="photoInput" type="file" accept="image/*;capture=camera" style="display:none" />

    <div id="photoPreview" aria-live="polite"></div>

    <label>說明 / 備註</label>
    <input id="note" type="text" placeholder="例如：葉子有點黃" />

    <div class="row" style="margin-top:10px">
      <button id="waterBtn" class="btn-primary">記錄澆水</button>
      <button id="savePlantBtn" class="btn-muted">儲存植物設定</button>
    </div>

    <div style="display:flex;gap:8px;margin-top:8px">
      <button id="resetDefaults" class="btn-muted" style="flex:1">重置建議為預設</button>
      <div id="status" class="small" style="flex:2;text-align:right"></div>
    </div>
  </main>

  <section class="card">
    <h2 style="margin:0 0 8px 0">紀錄</h2>
    <div id="records" class="small">載入中…</div>
  </section>

<script>
/* ---------- Keys and defaults ---------- */
const plantsKey = 'plants_v1';
const recordsKey = 'records_v1';
const defaultPlants = [
  {name:'日本松樹', target:3000},
  {name:'山烏龜', target:1500},
  {name:'印度榕', target:2500},
  {name:'多肉植物', target:800},
  {name:'蘭花', target:1200},
  {name:'薄荷', target:600},
  {name:'羅勒', target:700},
  {name:'龜背竹', target:2200},
  {name:'君子蘭', target:1400},
  {name:'檸檬樹', target:4000}
];

/* ---------- Safe localStorage wrapper ---------- */
function safeSetItem(key, value){
  try {
    localStorage.setItem(key, value);
    return true;
  } catch(e){
    console.warn('localStorage set error', e);
    return false;
  }
}

/* ---------- Plants load/save (merge defaults) ---------- */
function loadPlants(){
  const raw = localStorage.getItem(plantsKey);
  let stored = [];
  try { stored = raw ? JSON.parse(raw) : []; } catch(e){ stored = []; }
  const merged = defaultPlants.slice();
  stored.forEach(s=>{
    const idx = merged.findIndex(m=>m.name.toLowerCase() === s.name.toLowerCase());
    if(idx === -1) merged.push(s);
    else if(s.target) merged[idx].target = s.target;
  });
  defaultPlants.forEach(d=>{
    if(!merged.some(m=>m.name.toLowerCase()===d.name.toLowerCase())) merged.push(d);
  });
  safeSetItem(plantsKey, JSON.stringify(merged));
  return merged;
}
function savePlants(plants){ safeSetItem(plantsKey, JSON.stringify(plants)); }

/* ---------- Records load/save ---------- */
function loadRecords(){ return JSON.parse(localStorage.getItem(recordsKey) || '[]'); }
function saveRecordsArray(arr){ safeSetItem(recordsKey, JSON.stringify(arr)); }

/* ---------- IndexedDB helper (photos store) ---------- */
function openDb(){
  return new Promise((resolve, reject)=>{
    const req = indexedDB.open('plant-db', 1);
    req.onupgradeneeded = e => {
      const db = e.target.result;
      if(!db.objectStoreNames.contains('photos')) db.createObjectStore('photos', {keyPath:'id'});
    };
    req.onsuccess = e => resolve(e.target.result);
    req.onerror = e => reject(e.target.error);
  });
}

async function savePhotoBlob(blob){
  const db = await openDb();
  return new Promise((resolve, reject)=>{
    const tx = db.transaction('photos','readwrite');
    const store = tx.objectStore('photos');
    const id = 'p' + Date.now() + Math.floor(Math.random()*1000);
    const putReq = store.add({id, blob});
    putReq.onsuccess = ()=> resolve(id);
    putReq.onerror = e => reject(e.target.error);
  });
}

async function getPhotoBlob(id){
  if(!id) return null;
  const db = await openDb();
  return new Promise((resolve, reject)=>{
    const tx = db.transaction('photos','readonly');
    const store = tx.objectStore('photos');
    const req = store.get(id);
    req.onsuccess = e => resolve(e.target.result ? e.target.result.blob : null);
    req.onerror = e => reject(e.target.error);
  });
}

async function deletePhotoBlob(id){
  if(!id) return;
  const db = await openDb();
  return new Promise((resolve, reject)=>{
    const tx = db.transaction('photos','readwrite');
    const store = tx.objectStore('photos');
    const req = store.delete(id);
    req.onsuccess = ()=> resolve();
    req.onerror = e => reject(e.target.error);
  });
}

/* ---------- Migration: Base64 photo -> IndexedDB Blob ---------- */
async function migrateBase64PhotosToIndexedDB(){
  const recs = loadRecords();
  let changed = false;
  for(let i=0;i<recs.length;i++){
    const r = recs[i];
    if(r.photo && !r.photoId){
      try {
        const blob = base64ToBlob(r.photo);
        const photoId = await savePhotoBlob(blob);
        r.photoId = photoId;
        delete r.photo;
        changed = true;
      } catch(e){
        console.warn('Migration failed for record', r.id, e);
      }
    }
  }
  if(changed) saveRecordsArray(recs);
}

/* helper: convert dataURL to Blob */
function base64ToBlob(dataURL){
  const parts = dataURL.split(',');
  const meta = parts[0] || '';
  const base64 = parts[1] || '';
  const mimeMatch = meta.match(/:(.*?);/);
  const mime = mimeMatch ? mimeMatch[1] : 'image/jpeg';
  const binary = atob(base64);
  const len = binary.length;
  const u8 = new Uint8Array(len);
  for(let i=0;i<len;i++) u8[i] = binary.charCodeAt(i);
  return new Blob([u8], {type:mime});
}

/* ---------- UI elements ---------- */
const plantInput = document.getElementById('plantInput');
const suggestionsDiv = document.getElementById('suggestions');
const targetWeight = document.getElementById('targetWeight');
const currentWeight = document.getElementById('currentWeight');
const compareBtn = document.getElementById('compareBtn');
const takePhotoBtn = document.getElementById('takePhotoBtn');
const photoInput = document.getElementById('photoInput');
const photoPreview = document.getElementById('photoPreview');
const noteInput = document.getElementById('note');
const waterBtn = document.getElementById('waterBtn');
const savePlantBtn = document.getElementById('savePlantBtn');
const resetDefaultsBtn = document.getElementById('resetDefaults');
const status = document.getElementById('status');
const recordsDiv = document.getElementById('records');

let currentPhotoBlob = null;

/* ---------- Suggestions rendering ---------- */
function escapeHtml(s){ return String(s).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function renderSuggestions(){
  const plants = loadPlants();
  const list = plants.slice(0,10);
  suggestionsDiv.innerHTML = list.map(p=>`<div class="chip" data-name="${escapeHtml(p.name)}">${escapeHtml(p.name)}</div>`).join('');
  suggestionsDiv.querySelectorAll('.chip').forEach(chip=>{
    chip.addEventListener('click', ()=>{
      suggestionsDiv.querySelectorAll('.chip').forEach(c=>c.classList.remove('active'));
      chip.classList.add('active');
      const name = chip.getAttribute('data-name');
      plantInput.value = name;
      const plants = loadPlants();
      const found = plants.find(x=>x.name === name);
      if(found) targetWeight.value = found.target || '';
    });
  });
}
renderSuggestions();

/* ---------- Input handlers ---------- */
plantInput.addEventListener('input', ()=>{
  const name = plantInput.value.trim();
  if(!name){ targetWeight.value = ''; suggestionsDiv.querySelectorAll('.chip').forEach(c=>c.classList.remove('active')); return; }
  const plants = loadPlants();
  const found = plants.find(x=>x.name.toLowerCase() === name.toLowerCase());
  if(found) targetWeight.value = found.target || '';
  else targetWeight.value = '';
  suggestionsDiv.querySelectorAll('.chip').forEach(c=>{
    c.classList.toggle('active', c.getAttribute('data-name').toLowerCase() === name.toLowerCase());
  });
});

/* ---------- Save plant ---------- */
savePlantBtn.addEventListener('click', ()=>{
  const name = plantInput.value.trim();
  const tgt = Number(targetWeight.value) || null;
  if(!name){ showStatus('請輸入植物名稱。','err'); return; }
  if(!tgt){ showStatus('請輸入有效的目標重量。','err'); return; }
  const plants = loadPlants();
  const idx = plants.findIndex(x=>x.name.toLowerCase() === name.toLowerCase());
  if(idx >= 0) plants[idx].target = tgt;
  else plants.unshift({name, target: tgt});
  savePlants(plants);
  renderSuggestions();
  showStatus(`已儲存 ${name} 的目標重量 ${tgt} g。`,'ok');
});

/* ---------- Compare ---------- */
compareBtn.addEventListener('click', ()=>{
  const cur = Number(currentWeight.value);
  const tgt = Number(targetWeight.value);
  if(!cur || !tgt){ showStatus('請輸入目前重量與目標重量。','warn'); return; }
  const diff = cur - tgt;
  if(diff >= 0) showStatus(`目前重量比目標多 ${diff} g，暫時不需澆水。`,'ok');
  else showStatus(`目前比目標少 ${Math.abs(diff)} g，可能需要澆水。`,'warn');
});

/* ---------- Photo input ---------- */
takePhotoBtn.addEventListener('click', ()=> photoInput.click());
photoInput.addEventListener('change', (e)=>{
  const f = e.target.files && e.target.files[0];
  if(!f) return;
  currentPhotoBlob = f;
  const url = URL.createObjectURL(f);
  photoPreview.innerHTML = `<img class="thumb" src="${url}" alt="photo">`;
});

/* ---------- Record saving (uses IndexedDB for photos) ---------- */
waterBtn.addEventListener('click', async ()=>{
  const plantName = plantInput.value.trim();
  if(!plantName){ showStatus('請先輸入或選擇植物名稱。','err'); return; }
  const cur = Number(currentWeight.value) || null;
  const tgt = Number(targetWeight.value) || null;
  const note = noteInput.value || '';
  const now = new Date().toISOString();
  const recs = loadRecords();
  const id = 'r'+Date.now();

  async function trySaveRecord(photoId){
    recs.unshift({id, plantName, cur, tgt, note, date:now, photoId});
    const ok = safeSetItem(recordsKey, JSON.stringify(recs));
    if(!ok){
      recs.shift();
      showStatus('儲存失敗：本機儲存空間不足。請刪除舊紀錄或啟用雲端同步。','err');
      if(photoId) { try { await deletePhotoBlob(photoId); } catch(e){ console.warn('Failed to delete orphan photo', photoId, e); } }
      return;
    }
    currentPhotoBlob = null;
    photoPreview.innerHTML = '';
    noteInput.value = '';
    currentWeight.value = '';
    renderRecords();
    showStatus('已記錄澆水。','ok');
  }

  if(currentPhotoBlob){
    try {
      const photoId = await savePhotoBlob(currentPhotoBlob);
      await trySaveRecord(photoId);
    } catch(e){
      console.error('Error saving photo to IndexedDB', e);
      showStatus('儲存照片失敗，請重試或選擇較小的照片。','err');
    }
  } else {
    await trySaveRecord(null);
  }
});

/* ---------- Render records (fetch photo blobs by photoId) ---------- */
function daysSince(iso){
  const d = new Date(iso);
  const diff = Date.now() - d.getTime();
  return Math.floor(diff / 86400000);
}

async function renderRecords(){
  const recs = loadRecords();
  if(recs.length===0){ recordsDiv.innerHTML = '<p class="small">尚無紀錄</p>'; return; }
  recordsDiv.innerHTML = recs.map(r=>{
    const days = daysSince(r.date);
    const curTxt = r.cur ? `${r.cur} g` : '未量';
    const tgtTxt = r.tgt ? `${r.tgt} g` : '未設定';
    const photoHtml = r.photoId ? `<img class="thumb" data-photoid="${r.photoId}" src="" alt="photo" />` : '';
    return `<div class="plant" data-id="${r.id}">
      <strong>${escapeHtml(r.plantName)}</strong>
      <div class="small">澆水：${new Date(r.date).toLocaleString()}（${days} 天前）</div>
      <div class="small">目前重量：${curTxt}；目標：${tgtTxt}</div>
      ${photoHtml}
      <div class="small">備註：${escapeHtml(r.note) || '-'}</div>
    </div>`;
  }).join('');

  const imgs = recordsDiv.querySelectorAll('img[data-photoid]');
  imgs.forEach(async img => {
    const pid = img.getAttribute('data-photoid');
    try {
      const blob = await getPhotoBlob(pid);
      if(blob){
        const url = URL.createObjectURL(blob);
        img.src = url;
      } else {
        img.remove();
      }
    } catch(e){
      console.warn('Failed to load photo blob', pid, e);
      img.remove();
    }
  });
}

/* ---------- Reset defaults ---------- */
resetDefaultsBtn.addEventListener('click', ()=>{
  if(!confirm('確定要重置建議為預設？會覆蓋目前建議清單。')) return;
  safeSetItem(plantsKey, JSON.stringify(defaultPlants));
  location.reload();
});

/* ---------- Status helper ---------- */
function showStatus(msg, level){
  status.textContent = msg;
  status.className = 'small';
  if(level === 'ok') status.classList.add('status-ok');
  else if(level === 'warn') status.classList.add('status-warn');
  else if(level === 'err') status.classList.add('status-err');
  setTimeout(()=>{ status.textContent=''; status.className='small'; }, 3500);
}

/* ---------- Startup: migrate then render ---------- */
(async function startup(){
  try {
    renderSuggestions();
    await migrateBase64PhotosToIndexedDB();
    await renderRecords();
  } catch(e){
    console.error('Startup error', e);
  }
})();

/* ---------- Service worker registration (relative path) ---------- */
if('serviceWorker' in navigator){
  navigator.serviceWorker.register('./sw.js').catch(()=>{ /* ignore registration errors */ });
}
</script>
</body>
</html>
